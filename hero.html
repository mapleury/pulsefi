<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PulseFi — Kebiasaan Baik, Finansial Naik.</title>

<!-- Tailwind CSS (CDN) -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
        },
        colors: {
          ink: '#14161A',
        },
      },
    },
  };
</script>

<!-- Google Font -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<!-- Custom styles (keyframes, glassmorphism, precise hero layout) -->
<link rel="stylesheet" href="css/hero.css">
</head>
<body class="bg-white antialiased font-sans">

  <div class="hero-scroll-wrap">
  <div class="page-pad">
    <div class="hero-shell" id="home">

      <!-- background curtain artwork -->
      <img src="assets/hero-bg.svg" alt="" class="hero-bg" aria-hidden="true">

      <div class="hero-content">

        <!-- ============ NAVBAR ============ -->
        <header class="hero-nav-row">
          <a href="#home" class="logo" aria-label="PulseFi Home">
            <img src="assets/pulsefi-logo-icon.svg" alt="PulseFi" class="logo-icon">
          </a>

          <nav class="navbar-glass" aria-label="Navigasi utama">
            <ul>
              <li><a href="#home">Home</a></li>
              <li><a href="#tentang">Tentang</a></li>
              <li><a href="#tujuan">Tujuan</a></li>
              <li><a href="#testimoni">Testimoni</a></li>
              <li><a href="#mulai" class="nav-cta">Mulai</a></li>
            </ul>
          </nav>

          <button class="nav-burger" type="button" aria-label="Buka menu" aria-expanded="false">
            <span></span><span></span><span></span>
          </button>
        </header>

        <!-- mobile dropdown menu -->
        <nav class="mobile-menu" aria-label="Navigasi mobile">
          <a href="#home">Home</a>
          <a href="#tentang">Tentang</a>
          <a href="#tujuan">Tujuan</a>
          <a href="#testimoni">Testimoni</a>
          <a href="#mulai" class="nav-cta">Mulai</a>
        </nav>

        <!-- ============ HERO BODY ============ -->
        <div class="hero-inner">

          <!-- left: heading + CTA + user count -->
          <div class="hero-copy">
            <h1 class="hero-title">
              Kebiasaan Baik, <br> Finansial Naik.
            </h1>

            <a href="#mulai" class="hero-cta">
              <span>Mulai Sekarang</span>
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M3.33 8h9.34M8.67 3.33 13.33 8l-4.66 4.67" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </a>

            <div class="hero-users">
              <img src="assets/user-count.svg" alt="15 ribu+ pengguna aktif" class="user-count-img">
            </div>
          </div>

          <!-- right: card stack + feature list -->
          <div class="hero-visual">

            <div class="card-stack">
              <img src="assets/cc-1.svg" alt="" class="card card-1" aria-hidden="true">
              <img src="assets/cc-2.svg" alt="Kartu PulseFi atas nama Ralph Edwards" class="card card-2">
              <img src="assets/cc-3.svg" alt="Kartu PulseFi" class="card card-3">
            </div>

            <img src="assets/detail-hero.svg"
                 alt="Kelola uang lebih cerdas, rencanakan masa depan, pahami pola pengeluaranmu"
                 class="detail-hero-img">

          </div>

        </div>
      </div>

      <!-- Frame overlay: a white matte with a notched window cut out,
           painted the same white as the page background so it "erases"
           the shell's square corners and leaves only the notched
           window visible. Sits above absolutely everything else. -->
      <img src="assets/hero-frame.svg" alt="" class="hero-frame" aria-hidden="true">
    </div>
  </div>
  </div>

  <section class="post-hero-space"></section>

  <script src="js/hero.js"></script>
</body>
</html>
