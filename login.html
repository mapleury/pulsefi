<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PulseFi Login & Signup</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
      <link rel="icon" type="image/svg+xml" href="assets/browser-logo.svg">
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
        background-color: #ffff; /* Updated background */
        }

        /* Updated Letter Spacing */
        .spacing-caps {
            letter-spacing: -0.3px;
        }
        .spacing-headline {
            letter-spacing: -1px; 
        }

        /* Exact Input Borders */
        .custom-input {
            border: 1px solid #C1C1C1;
            border-radius: 12px;
            background-color: #ffffff;
            transition: border-color 0.2s ease-in-out;
        }

        .custom-input:focus {
            border-color: #2A263D;
            outline: none;
        }

        /* Smooth Expand/Collapse Transition for the Form Field */
        .expand-transition {
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .expand-transition.expanded {
            max-height: 100px; /* Large enough to fit the input and label */
            opacity: 1;
            margin-top: 1rem; /* Matches the space-y gap */
        }

        /* Smooth Fade for Text changes */
        .fade-text {
            transition: opacity 0.2s ease-in-out;
        }

        /* Entry Animations */
        .fade-in {
            animation: fadeIn 0.8s ease-out forwards;
            opacity: 0;
        }
        .slide-up {
            animation: slideUp 0.8s ease-out forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }
        @keyframes slideUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 sm:p-8">

    <!-- Main Container -->
    <div class="max-w-[1050px] w-full flex flex-col md:flex-row gap-6 md:gap-8 items-stretch h-full md:h-[600px]">
        
        <!-- Left Illustration Container (Wider now: md:w-7/12) -->
        <div class="hidden md:flex w-full md:w-7/12 relative bg-[#EBE4FE] rounded-[32px] overflow-hidden fade-in shadow-sm">
            <img src="assets/login.svg" alt="Card Illustrations" class="absolute inset-0 w-full h-full object-cover">
        </div>

        <!-- Right Form Container (Narrower now: md:w-5/12) -->
        <div class="w-full md:w-5/12 bg-[#F7F7F7] rounded-[32px] p-8 md:p-12 flex flex-col justify-center slide-up shadow-[0_4px_24px_rgba(0,0,0,0.02)]" style="animation-delay: 0.2s;">
            
            <!-- Header Text -->
            <div class="text-center mb-8">
                <p id="subheading" class="text-[11px] text-[#828282] font-regular uppercase spacing-caps mb-2 fade-text">
                    LOGIN KE AKUN
                </p>
            <h1 id="heading" class="text-2xl md:text-[1.65rem] leading-tight font-semibold text-black spacing-headline fade-text whitespace-nowrap">Selamat Datang Kembali!</h1>
            </div>

            <!-- Inline error/success message — hidden until auth-ui.js shows one -->
            <div id="auth-message" class="hidden items-start gap-2.5 rounded-2xl px-4 py-3 mb-5 text-[13px] font-medium leading-snug opacity-0 -translate-y-1 transition-all duration-300 ease-out" role="alert" aria-live="assertive">
                <svg id="auth-message-icon" class="w-4 h-4 mt-0.5 shrink-0" fill="none" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"></svg>
                <span id="auth-message-text" class="flex-1"></span>
                <button id="auth-message-close" type="button" class="shrink-0 opacity-50 hover:opacity-100 transition-opacity" aria-label="Tutup pesan">
                    <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" d="M6 6l12 12M18 6L6 18"/></svg>
                </button>
            </div>

            <!-- Form -->
            <form id="auth-form" class="w-full max-w-sm mx-auto" onsubmit="event.preventDefault();">
                
                <div class="space-y-4">
                    <!-- Email Field -->
                                 <div class="flex flex-col gap-1.5">
                        <label class="text-[13px] text-[#A3A3A3] ml-1">Email</label>
                        <input type="email" id="email-input" class="custom-input w-full px-4 py-3" required>
                    </div>
                    
                    <!-- Password Field with Toggle -->
                    <div class="flex flex-col gap-1.5">
                        <label class="text-[13px] text-[#A3A3A3] ml-1">Password</label>
                        <div class="relative">
                            <input type="password" id="password-input" class="custom-input w-full pl-4 pr-12 py-3" required>
                            <button type="button" id="toggle-password-btn" class="absolute right-4 top-1/2 -translate-y-1/2 text-[#A3A3A3] hover:text-[#2A263D] transition-colors focus:outline-none">
                                <!-- Default SVG: Eye off (Hidden) -->
                                <svg id="eye-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" />
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Monthly Income Field (Smoothly expands/collapses) -->
                         <div id="pemasukan-container" class="flex flex-col gap-1.5 expand-transition">
                    <label class="text-[13px] text-[#A3A3A3] ml-1">Pemasukan Bulanan</label>
                    <input type="text" id="pemasukan-input" inputmode="numeric" class="custom-input w-full px-4 py-3">
                </div>

                <!-- Submit Button -->
                <button type="submit" id="auth-submit-btn" class="w-full bg-[#2A263D] hover:bg-[#1f1c2d] text-white rounded-[24px] py-3.5 mt-6 transition-colors duration-200 text-[15px] font-medium">
                    Login
                </button>
            </form>

            <!-- Footer Toggle -->
            <div class="mt-8 text-center text-[12px] text-[#828282] fade-text" id="footer-container">
                <span id="footer-text">Buat profil PulseFi baru?</span> 
                <button id="toggle-form-btn" class="font-bold text-[#2A263D] underline underline-offset-2 hover:text-black transition-colors ml-1">
                    Klik disini
                </button>
            </div>

        </div>
    </div>

        <script src="js/app.js"></script>
    <script src="js/auth-ui.js"></script>
    <script src="js/auth.js"></script>
    <!-- Scripts for Logic -->
     
</body>
</html>
