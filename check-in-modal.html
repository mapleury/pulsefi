<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PulseFi Check-In Modal (Snappiest Click & Wider Gaps)</title>
  
  <!-- Import Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            serif: ['Instrument Serif', 'serif'],
          },
          colors: {
            modal: {
              overlay: 'rgba(215, 216, 224, 0.7)',
              darkCard: '#1a192b',
              purpleCard: '#5c42a6',
              lightCard: '#f4f5f8',
              inactiveDay: '#e8def7',
            }
          }
        }
      }
    }
  </script>
  
  <style>
    /* Modal entry/exit animations */
    .modal-backdrop-enter { animation: fadeIn 0.6s ease forwards; }
    .modal-backdrop-exit { animation: fadeOut 0.5s ease forwards; }
    .modal-enter { animation: slideUpFade 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .modal-exit { animation: slideDownFade 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    
    @keyframes fadeIn { from { opacity: 0; backdrop-filter: blur(0px); } to { opacity: 1; backdrop-filter: blur(4px); } }
    @keyframes fadeOut { from { opacity: 1; backdrop-filter: blur(4px); } to { opacity: 0; backdrop-filter: blur(0px); } }
    @keyframes slideUpFade {
      from { opacity: 0; transform: translateY(30px) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes slideDownFade {
      from { opacity: 1; transform: translateY(0) scale(1); }
      to { opacity: 0; transform: translateY(20px) scale(0.95); }
    }

    /* Adjusted: Even shorter and snappier Card click rotation animation */
    .card-click { animation: popRotate 0.2s cubic-bezier(0.34, 1.56, 0.64, 1); }
    @keyframes popRotate {
      0% { transform: scale(1) rotate(0deg); }
      30% { transform: scale(0.94) rotate(-2deg); }
      60% { transform: scale(1.01) rotate(1deg); }
      100% { transform: scale(1) rotate(0deg); }
    }

    /* Dynamic Bar Animations */
    .bar-grow { transition: height 0.8s cubic-bezier(0.34, 1.56, 0.64, 1), background-color 0.5s ease; }
  </style>
</head>
<body class="bg-gray-100 h-screen w-full flex items-center justify-center font-sans antialiased overflow-hidden">

  <!-- Modal Overlay -->
  <div id="modal-overlay" class="fixed inset-0 bg-modal-overlay flex items-center justify-center modal-backdrop-enter z-50 px-4">
    
    <!-- Modal Container -->
    <div id="modal-box" class="bg-white w-full max-w-[500px] p-6 rounded-[32px] shadow-2xl relative overflow-hidden modal-enter">
      
      <!-- STATE 1: Habit Selection -->
      <div id="state-1" class="relative z-10 transition-all duration-700 ease-in-out transform opacity-100 translate-x-0 flex flex-col">
        
        <div class="flex items-center mb-4">
          <span class="border border-gray-300 rounded-full px-3 py-1 text-xs font-medium text-gray-700 tracking-tight">Check-In Harian</span>
        </div>
        
        <h2 class="text-xl font-medium text-gray-900 leading-snug tracking-tight mb-5 w-4/5">
          Psst.. Hey,<br>
          Masih konsisten dengan kebiasaan barumu?
        </h2>

        <!-- Cards Container -->
        <div class="flex gap-3 mb-8">
          
          <!-- Card 1 (Dark) -->
          <div class="habit-card bg-modal-darkCard text-white rounded-2xl p-4 w-1/3 aspect-[4/5] cursor-pointer flex flex-col justify-between shadow-sm relative group" data-theme="dark">
            <span class="font-serif text-[22px] leading-[1.1] tracking-[-0.03em]">Menunda<br>Jajan Kopi</span>
            <div class="check-icon absolute bottom-3 right-3 opacity-0 transition-opacity duration-300"></div>
          </div>
          
          <!-- Card 2 (Purple) -->
          <div class="habit-card bg-modal-purpleCard text-white rounded-2xl p-4 w-1/3 aspect-[4/5] cursor-pointer flex flex-col justify-between shadow-sm relative group" data-theme="purple">
            <span class="font-serif text-[22px] leading-[1.1] tracking-[-0.03em]">Menggunakan<br>Transum</span>
            <div class="check-icon absolute bottom-3 right-3 opacity-0 transition-opacity duration-300"></div>
          </div>
          
          <!-- Card 3 (Light) -->
          <div class="habit-card bg-modal-lightCard text-gray-900 rounded-2xl p-4 w-1/3 aspect-[4/5] cursor-pointer flex flex-col justify-between shadow-sm relative group" data-theme="light">
            <span class="font-serif text-[22px] leading-[1.1] tracking-[-0.03em]">Tidak beli<br>gorengan</span>
            <div class="check-icon absolute bottom-3 right-3 opacity-0 transition-opacity duration-300"></div>
          </div>

        </div>

        <div class="mt-auto flex justify-between items-center pt-2">
          <span class="text-sm font-medium text-gray-800">Klik yang telah kamu kerjakan..</span>
          <button id="next-btn" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-gray-100 transition-colors cursor-pointer z-20 relative">
            <svg class="w-5 h-5 text-gray-900" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
            </svg>
          </button>
        </div>
      </div>

      <!-- STATE 2: Summary / Days -->
      <div id="state-2" class="absolute inset-0 p-6 flex flex-col z-0 transition-all duration-700 ease-in-out transform translate-x-12 opacity-0 pointer-events-none">
        
        <div class="flex items-center mb-4">
          <span class="border border-gray-300 rounded-full px-3 py-1 text-xs font-medium text-gray-700 tracking-tight">Check-In Harian</span>
        </div>

        <h2 class="text-[20px] font-medium text-gray-900 leading-snug tracking-tight mb-8 w-11/12">
          Makasih sudah berusaha mempertahankan Kebiasaanmu di hari ini!
        </h2>

        <!-- Days Graph Container (Increased gaps to gap-4 sm:gap-5) -->
        <div id="days-container" class="flex justify-center gap-4 sm:gap-5 items-end flex-grow mb-8 pb-4">
          <!-- Populated by JS -->
        </div>

        <div class="mt-auto flex justify-between items-center">
          <span class="text-sm font-medium text-gray-800">Lanjut ke dashboard..</span>
          <button id="close-btn" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-gray-100 transition-colors pointer-events-auto cursor-pointer">
            <svg class="w-5 h-5 text-gray-900" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
            </svg>
          </button>
        </div>
      </div>

    </div>
  </div>

  <!-- SVG Assets for Checkmarks -->
  <template id="svg-checked-white">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="20 6 9 17 4 12"></polyline>
    </svg>
  </template>
  
  <template id="svg-checked-black">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#101010" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="20 6 9 17 4 12"></polyline>
    </svg>
  </template>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const cards = document.querySelectorAll('.habit-card');
      const nextBtn = document.getElementById('next-btn');
      const closeBtn = document.getElementById('close-btn');
      const state1 = document.getElementById('state-1');
      const state2 = document.getElementById('state-2');
      const daysContainer = document.getElementById('days-container');
      const modalBox = document.getElementById('modal-box');
      const modalOverlay = document.getElementById('modal-overlay');

      const checkWhite = document.getElementById('svg-checked-white').innerHTML;
      const checkBlack = document.getElementById('svg-checked-black').innerHTML;

      let selectedHabits = 0;
      
      // Real Date Logic
      const today = new Date();
      const rawDay = today.getDay(); // 0 = Sunday, 1 = Monday...
      const currentDayIndex = rawDay === 0 ? 6 : rawDay - 1; 

      const dayNames = ['Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab', 'Min'];
      const pastDataMask = [false, false, true, false, true, false, false]; 

      // --- Card Interaction Logic ---
      cards.forEach(card => {
        card.addEventListener('click', () => {
          card.classList.remove('card-click');
          void card.offsetWidth; 
          card.classList.add('card-click');

          const isSelected = card.classList.contains('selected');
          const checkIconContainer = card.querySelector('.check-icon');
          const theme = card.getAttribute('data-theme');

          if (!isSelected) {
            card.classList.add('selected');
            selectedHabits++;
            
            checkIconContainer.innerHTML = (theme === 'light') ? checkBlack : checkWhite;
            checkIconContainer.classList.remove('opacity-0');
            checkIconContainer.classList.add('opacity-100');
            
            card.style.transform = 'scale(0.97)';
          } else {
            card.classList.remove('selected');
            selectedHabits--;
            
            checkIconContainer.classList.remove('opacity-100');
            checkIconContainer.classList.add('opacity-0');
            
            card.style.transform = 'scale(1)';
          }
        });
      });

      // --- Transition to State 2 ---
      nextBtn.addEventListener('click', () => {
        state1.classList.remove('opacity-100', 'translate-x-0');
        state1.classList.add('opacity-0', '-translate-x-12', 'pointer-events-none');
        
        setTimeout(() => {
          state2.classList.remove('opacity-0', 'translate-x-12', 'pointer-events-none');
          state2.classList.add('opacity-100', 'translate-x-0', 'pointer-events-auto', 'z-20');
          
          renderDaysGraph();
        }, 150);
      });

      // --- Graph Rendering Logic ---
      function renderDaysGraph() {
        daysContainer.innerHTML = ''; 

        let todayBgColor = 'bg-modal-inactiveDay';
        let todayCheckSvg = '';

        if (selectedHabits === 1) {
          todayBgColor = 'bg-modal-lightCard'; 
          todayCheckSvg = checkBlack;
        } else if (selectedHabits === 2) {
          todayBgColor = 'bg-modal-purpleCard'; 
          todayCheckSvg = checkWhite;
        } else if (selectedHabits === 3) {
          todayBgColor = 'bg-modal-darkCard'; 
          todayCheckSvg = checkWhite;
        }

        dayNames.forEach((day, index) => {
          const isToday = index === currentDayIndex;
          const isPastFilled = pastDataMask[index] && index < currentDayIndex;

          const col = document.createElement('div');
          col.className = 'flex flex-col items-center justify-end h-full w-[44px]';

          // Header Pill
          const header = document.createElement('div');
          header.className = `font-serif tracking-[-0.03em] text-[18px] mb-4 px-2 py-0.5 rounded-full flex items-center justify-center transition-all duration-700 ${isToday ? 'bg-modal-darkCard text-white' : 'text-gray-900 bg-transparent'}`;
          header.innerText = day;
          col.appendChild(header);

          // Bar wrapper (anchors the bars to the bottom)
          const barWrapper = document.createElement('div');
          barWrapper.className = 'flex items-end h-[120px]';

          // The physical bar
          const bar = document.createElement('div');
          bar.className = 'w-[44px] rounded-xl flex items-center justify-center bar-grow h-0';
          
          if (isToday) {
            bar.classList.add(todayBgColor.replace('bg-', '')); 
            bar.style.backgroundColor = getBgColorHex(todayBgColor);
            
            if (selectedHabits > 0) {
              bar.innerHTML = `<div class="opacity-0 transition-opacity duration-500 delay-[600ms] scale-75 transform">${todayCheckSvg}</div>`;
            }
          } else {
            const bgColor = isPastFilled ? 'bg-modal-purpleCard' : 'bg-modal-inactiveDay';
            bar.classList.add(bgColor.replace('bg-', ''));
            bar.style.backgroundColor = getBgColorHex(bgColor);
          }
          
          barWrapper.appendChild(bar);
          col.appendChild(barWrapper);
          daysContainer.appendChild(col);

          // Trigger staggered grow animations
          setTimeout(() => {
            // Taller bars: 110px for today, 65px for past
            bar.style.height = isToday ? '110px' : '65px';
            
            const innerCheck = bar.querySelector('div');
            if(innerCheck) {
              setTimeout(() => {
                innerCheck.classList.remove('opacity-0', 'scale-75');
                innerCheck.classList.add('opacity-100', 'scale-100');
              }, 700); 
            }
          }, index * 120); 
        });
      }

      function getBgColorHex(twClass) {
        if(twClass === 'bg-modal-darkCard') return '#1a192b';
        if(twClass === 'bg-modal-purpleCard') return '#5c42a6';
        if(twClass === 'bg-modal-lightCard') return '#f4f5f8';
        return '#e8def7'; 
      }

      // --- Close Modal ---
      closeBtn.addEventListener('click', () => {
        modalBox.classList.remove('modal-enter');
        modalOverlay.classList.remove('modal-backdrop-enter');
        
        modalBox.classList.add('modal-exit');
        modalOverlay.classList.add('modal-backdrop-exit');
        
        setTimeout(() => {
          modalOverlay.style.display = 'none';
        }, 600);
      });
    });
  </script>
</body>
</html>
